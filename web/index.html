<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DilSe: Stream high-quality music with pure emotion. Suno Dil Se.">

  <!-- Google Sign-In Client ID -->
  <meta name="google-signin-client_id" content="130201428767-i1tt2et39of41d7mfs4j3d7fmnab5ug4.apps.googleusercontent.com">

  <!-- Mobile meta tags & icons -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DilSe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="theme-color" content="#000000">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DilSe - Suno Dil Se</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg-oled: #000000;
      --ruby-brand: #FA2D48;
      --ruby-glow: rgba(250, 45, 72, 0.45);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body, html {
      background-color: var(--bg-oled);
      color: #ffffff;
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* Sovereign Failsafe Recovery Card (Zero intrusive overlays; only visible if bootstrap stalls >8s) */
    #dilse-offline-failsafe-card {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      margin: 0;
      padding: 16px 20px;
      background: #161616;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      text-align: center;
      max-width: 320px;
      pointer-events: auto;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.8);
    }
    .failsafe-btn {
      background: #242424;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      margin: 4px;
      cursor: pointer;
    }
    .failsafe-btn.primary {
      background: #FA2D48;
      border-color: #FA2D48;
    }
  </style>
</head>
<body>
  <!-- Sovereign Failsafe Recovery Card (Zero DOM interference; hidden unless watchdog fires) -->
  <div id="dilse-offline-failsafe-card">
    <div style="font-size: 13.5px; font-weight: 700; margin-bottom: 4px; color: #ffffff;">Startup Stalled</div>
    <div style="font-size: 11.5px; color: rgba(255,255,255,0.65); margin-bottom: 12px; line-height: 1.4;">
      If startup is taking longer than expected, reload or reset the offline cache.
    </div>
    <div style="display: flex; justify-content: center; gap: 8px;">
      <button class="failsafe-btn primary" onclick="location.reload()">Reload</button>
      <button class="failsafe-btn" onclick="clearDilSeCache()">Reset Cache</button>
    </div>
  </div>

  <script>
    // Sovereign Engine Watchdog (8.0 seconds timeout for emergency recovery):
    var dilseWatchdog = setTimeout(function () {
      var card = document.getElementById('dilse-offline-failsafe-card');
      if (card) {
        card.style.display = 'block';
      }
    }, 8000);

    // Global hook to dismiss the failsafe smoothly
    window.dismissDilSeFallback = function () {
      clearTimeout(dilseWatchdog);
      var card = document.getElementById('dilse-offline-failsafe-card');
      if (card) {
        card.remove();
      }
    };

    // Watch for Flutter view attachment
    var observer = new MutationObserver(function (mutations) {
      if (document.querySelector('flutter-view') || document.querySelector('flt-glass-pane')) {
        observer.disconnect();
        window.dismissDilSeFallback();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    function clearDilSeCache() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
      }
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          return Promise.all(keys.map(function (k) { return caches.delete(k); }));
        }).then(function () {
          location.reload(true);
        });
      } else {
        location.reload();
      }
    }
  </script>

  <!-- DilSe Audio Engine (Method 1: Invisible YouTube Player + MediaSession) -->
  <script src="https://www.youtube.com/iframe_api" async defer onerror="console.warn('[DilSe] YouTube IFrame offline')"></script>
  <script src="dilse_web_player.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').then(function (reg) {
          reg.update();
          console.log('[DilSe ServiceWorker] Registered successfully (scope: ' + reg.scope + ')');
        }).catch(function (err) {
          console.warn('[DilSe ServiceWorker] Registration failed:', err);
        });
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
